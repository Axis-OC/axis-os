--
-- /etc/dm.cfg
-- Display Manager Configuration
--
-- Set enabled = true to boot into graphical mode.
-- Set enabled = false (or delete this file) for text-mode login.
--
return {
    enabled = false,

    -- Auto-login: skip login screen and go straight to desktop.
    -- Set to a username string, or nil/false to require login.
    auto_login = false,
    auto_login_user = nil,

    -- Desktop session to launch after login
    desktop_session = "/system/desktop.lua",

    -- Appearance
    wallpaper_color = 0x0C0C1E,
    accent_color    = 0x55FFFF,
    taskbar_position = "bottom",  -- "bottom" or "top"
    taskbar_height   = 1,

    -- Multi-GPU: which GPU index to use for the login screen
    -- nil = auto (first available)
    gpu_index = nil,

    -- Multi-GPU mode (for desktop session)
    multi_gpu = {
        enabled = false,
        -- Each entry: { gpu = N, screen = "addr" }
        -- bindings = {},
    },
}