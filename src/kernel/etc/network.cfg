--
-- /etc/network.cfg
-- AxisOS Network Configuration (v2 — VLAN + DMZ support)
--
return {
    forwarding = false,
    hostname   = "axis-node",

    interfaces = {
        {
            name    = "eth0",
            ip      = "10.0.0.1",
            mask    = "255.255.255.0",
            -- gateway only needed if routing to other OC modems
            -- gateway = "10.0.0.254",
            vlan = {
                mode       = "access",
                native_vid = 0,
            },
        },
    },

    dns = {
        servers    = {},
        use_doh    = true,   -- Uses internet card, not modem
        doh_server = "https://cloudflare-dns.com/dns-query",
        cache_size = 128,
        cache_ttl  = 300,
    },

    routes     = {},
    arp_static = {},
    firewall   = {},
}