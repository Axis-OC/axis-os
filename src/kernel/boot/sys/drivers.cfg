--
-- /boot/sys/drivers.cfg
-- AxisOS Driver Autoload Configuration
--
-- Drivers are loaded at boot in dependency + priority order.
-- Lower priority number = loads earlier.
--
-- Fields:
--   name        Unique identifier (used in dependency references)
--   path        Absolute path to the .sys.lua driver file
--   enabled     true/false — disabled drivers are skipped entirely
--   priority    Load order hint (lower = earlier, default 500)
--   depends     List of driver names this requires (loaded first)
--   description Human-readable description (shown by drvconf)
--
return {
    {
        name        = "gpu",
        path        = "/drivers/gpu.sys.lua",
        enabled     = true,
        priority    = 150,
        depends     = {},
        description = "Multi-GPU driver with GX_AX extensions (swapchains, fences, cmd buffers)",
    },
    {
        name        = "internet",
        path        = "/drivers/internet.sys.lua",
        enabled     = true,
        priority    = 250,
        depends     = {},
    },
    {
        name        = "modem",
        path        = "/drivers/modem_nic.sys.lua",
        enabled     = true,
        priority    = 260,
        depends     = {"internet"},
    },
    {
        name        = "blkdev",
        path        = "/drivers/blkdev.sys.lua",
        enabled     = true,
        priority    = 300,
        depends     = {},
    },
}